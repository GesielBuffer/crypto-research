[experiment]
strategy_version = "CROSS_SECTIONAL_FUNDING_CARRY_V2"
hypothesis = "Median-exit hysteresis preserves the V1 funding-spread signal while reducing turnover and broadening contribution enough to survive stress costs."
registered_on = "2026-09-26"
status = "PREREGISTERED"
family = "cross_sectional_funding_carry_hysteresis"
parent = "CROSS_SECTIONAL_FUNDING_CARRY_V1"
change_from_parent = "Portfolio membership only; signal, universe, periods, costs and gates remain fixed."

[data]
price_manifest = "manifests/cross_sectional_momentum_v1.json"
funding_manifest = "manifests/cross_sectional_funding_carry_v1.json"
interval = "4h"
start = "2024-01-01"
discovery_end = "2026-08-01"
universe_source = "results/cross_sectional_momentum_v1_universe.csv"

[signal]
trailing_funding_records = 3
rebalance_funding_periods = 3
ranking = "mean funding using only three settled records available at rebalance"
entry_fraction = 0.25
exit_boundary = 0.50
direction = "enter long bottom quartile and short top quartile; retain until crossing the cross-sectional median"
entry = "first common 4h open strictly after the observed funding timestamp"

[portfolio]
gross_exposure = 1.0
long_gross = 0.5
short_gross = 0.5
weighting = "equal weight among active names on each side after hysteresis"
round_trip_costs = [0.0006, 0.0014]
cost_application = "round_trip_cost divided by two, charged per absolute signed weight change"
funding_accounting = "identical to V1"

[splits]
development = ["2024-04-01", "2025-01-01"]
validation = ["2025-01-01", "2026-01-01"]
confirmation = ["2026-01-01", "2026-08-01"]

[bootstrap]
resamples = 2000
seed = 20260926
block_periods = 7
research_min_probability_positive = 0.90
holdout_min_probability_positive_each_split = 0.95

[research_continuation]
minimum_periods_each_full_split = 80
minimum_periods_confirmation = 45
minimum_base_profit_factor_each_split = 1.00
minimum_pooled_profit_factor = 1.08
minimum_positive_symbols = 8
max_pooled_drawdown = 0.20

[holdout_selection]
minimum_periods_each_full_split = 80
minimum_periods_confirmation = 45
base_cost_min_profit_factor_each_split = 1.10
stress_cost_min_profit_factor_each_split = 1.00
minimum_positive_symbols = 10
max_pooled_drawdown = 0.15

[fresh_holdout]
start = "2026-09-01"
end = "2026-09-26"
status = "UNOPENED"
minimum_periods = 8
base_cost_min_profit_factor = 1.10
stress_cost_min_profit_factor = 1.00
max_drawdown = 0.08
rule = "Only HOLDOUT_READY may open this interval; RESEARCH_CANDIDATE remains discovery-only."

[decision]
levels = ["REJECT", "RESEARCH_CANDIDATE", "HOLDOUT_READY"]
production_effect = "None until fresh holdout, paper, Testnet, operational and human gates also pass."
