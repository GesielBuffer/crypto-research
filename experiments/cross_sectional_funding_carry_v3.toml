[experiment]
strategy_version = "CROSS_SECTIONAL_FUNDING_CARRY_V3"
hypothesis = "The unchanged V2 hysteresis portfolio is robust to asset removal and persists in the untouched September holdout."
registered_on = "2026-09-26"
status = "FAIL_HOLDOUT"
family = "cross_sectional_funding_carry_hysteresis"
parent = "CROSS_SECTIONAL_FUNDING_CARRY_V2"
strategy_change_from_parent = "none"
evaluation_change = "replace positive-symbol count with leave-one-asset-out dependency; pooled bootstrap plus moderate per-split floor"

[data]
discovery_price_manifest = "manifests/cross_sectional_momentum_v1.json"
discovery_funding_manifest = "manifests/cross_sectional_funding_carry_v1.json"
interval = "4h"
discovery_start = "2024-01-01"
discovery_end = "2026-08-01"
universe_source = "results/cross_sectional_momentum_v1_universe.csv"
extension_start = "2026-08-01"
extension_end = "2026-09-26"

[strategy]
trailing_funding_records = 3
rebalance_funding_periods = 3
entry_fraction = 0.25
exit_boundary = 0.50
long_gross = 0.5
short_gross = 0.5
round_trip_costs = [0.0006, 0.0014]

[discovery_gate]
base_cost_min_profit_factor_each_split = 1.10
stress_cost_min_profit_factor_each_split = 1.00
max_pooled_drawdown = 0.15
pooled_bootstrap_probability_positive = 0.99
minimum_split_bootstrap_probability_positive = 0.80
leave_one_asset_out_min_profit_factor = 1.10
leave_one_asset_out_max_drawdown = 0.20

[opened_stress]
start = "2026-08-01"
end = "2026-09-01"
role = "diagnostic only; August outcomes were opened by earlier research"

[fresh_holdout]
start = "2026-09-01"
end = "2026-09-26"
status = "OPENED_ONCE_FAIL"
minimum_periods = 8
base_cost_min_profit_factor = 1.10
stress_cost_min_profit_factor = 1.00
max_drawdown = 0.08
mean_return_must_be_positive = true
rule = "No strategy, universe, parameter, cost or decision threshold may change after this registration."

[promotion]
holdout_pass_effect = "Advance to shadow/paper preparation only; no real order permission."
holdout_fail_effect = "Reject the frozen candidate without retuning September."
observed = "September produced PF 0.992 at base cost and 0.930 at stress cost; mean base return was negative."
